<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>生产管理系统</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231f6feb'/><path d='M8 21h4v-6H8v6zm6 0h4V11h-4v10zm6 0h4v-9h-4v9z' fill='white'/></svg>" />
<link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/css/components.css" />
<link rel="stylesheet" href="/css/pages.css" />
<link rel="stylesheet" href="/css/print.css" media="all" />
</head>
<body>

<div class="app">
  <!-- ============ 侧边导航 ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-logo">柏</span>
      <span class="brand-text">生产管理系统</span>
    </div>

    <nav class="nav" id="nav">
      <a class="nav-item" href="#/home"      data-route="home"><i class="ico ico-home"></i><span>首页</span></a>
      <a class="nav-item" href="#/today"     data-route="today"><i class="ico ico-edit"></i><span>今日报表</span></a>
      <a class="nav-item" href="#/history"   data-route="history"><i class="ico ico-list"></i><span>历史记录</span></a>
      <a class="nav-item" href="#/progress"  data-route="progress"><i class="ico ico-chart"></i><span>生产进度</span></a>

      <div class="nav-group" data-group="stock">
        <a class="nav-item nav-parent" href="#/stock" data-route="stock">
          <i class="ico ico-box"></i><span>成品库存</span><i class="caret"></i>
        </a>
        <div class="nav-sub">
          <a class="nav-item sub" href="#/stock"    data-route="stock"><span>成品库存</span></a>
          <a class="nav-item sub" href="#/inbound"  data-route="inbound"><span>其他入库</span></a>
          <a class="nav-item sub" href="#/outbound" data-route="outbound"><span>成品出库</span></a>
        </div>
      </div>

      <a class="nav-item" href="#/settings"  data-route="settings"><i class="ico ico-cog"></i><span>系统配置</span></a>
    </nav>

    <div class="sidebar-foot">
      <div class="db-badge" id="dbBadge" title="数据引擎">libSQL</div>
      <div class="ver">v1.0.0</div>
    </div>
  </aside>

  <!-- ============ 主体 ============ -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="btnToggleSide" title="收起/展开导航">☰</button>
      <div class="crumb" id="crumb">首页</div>
      <div class="topbar-right">
        <span class="user-chip" id="userChip"><i class="dot"></i><span id="userName">游客</span></span>
        <button class="btn btn-primary btn-sm" id="btnLogin">登录</button>
        <button class="btn btn-sm hidden" id="btnLogout">退出</button>
      </div>
    </header>

    <section class="view" id="view"></section>

    <footer class="statusbar">
      <span id="statusMsg">就绪</span>
      <span class="spacer"></span>
      <span id="statusUser">游客模式（只读）</span>
    </footer>
  </main>
</div>

<!-- 全局挂载点 -->
<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root"></div>

<!-- A4 报表打印容器（屏幕上不可见，仅在打印时输出） -->
<div id="printArea"></div>

<!-- 登录弹窗 -->
<div class="mask hidden" id="loginMask">
  <div class="dialog dialog-sm">
    <div class="dialog-head">
      <span>用户登录</span>
      <button class="dialog-x" data-close="loginMask">×</button>
    </div>
    <div class="dialog-body">
      <div class="field">
        <label>账号</label>
        <input type="text" id="loginUser" placeholder="柏兴圣" autocomplete="username" />
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="loginPass" placeholder="wq*533520" autocomplete="current-password" />
      </div>
      <div class="login-tip" id="loginTip">默认账号 admin / 密码 admin123</div>
    </div>
    <div class="dialog-foot">
      <button class="btn" data-close="loginMask">取消</button>
      <button class="btn btn-primary" id="loginSubmit">登录</button>
    </div>
  </div>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
